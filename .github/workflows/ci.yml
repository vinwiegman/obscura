name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    # The core -- geometry, healing, redaction -- must stay testable without
    # onnxruntime or downloaded weights. This job is what enforces that.
    name: core (no inference backend)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  contract:
    # Catches uniface renaming a class or changing what BYTETracker returns.
    name: uniface contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[cpu,dev]'
      - run: pytest -q tests/test_uniface_contract.py

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t obscura .
      - run: docker run --rm obscura --help
